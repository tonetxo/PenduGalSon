<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Péndulo Musical</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }

    .cursor-default {
      cursor: default;
    }

    .cursor-grab {
      cursor: grab;
    }

    .cursor-grabbing {
      cursor: grabbing;
    }

    .cursor-crosshair {
      cursor: crosshair;
    }

    /* Para dispositivos móbiles */
    @media (max-width: 768px) {
      .translate-x-full {
        transform: translateX(100%);
      }
      
      .translate-x-0 {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    // Hooks e contexto
    const { useRef, useState, useEffect, useCallback, createContext, useContext } = React;

    const PhysicsContext = createContext();

    const usePhysics = () => {
      const context = useContext(PhysicsContext);
      if (!context) {
        throw new Error('usePhysics must be used within a PhysicsProvider');
      }
      return context;
    };

    const PhysicsProvider = ({ children, initialState, isSimulating, gravity, mass1, mass2, mode }) => {
      const engineRef = useRef({
        pivot: null,
        pendulum1: { angle: Math.PI/4, velocity: 0, length: 200, x: 0, y: 0 },
        pendulum2: { angle: Math.PI/4, velocity: 0, length: 0, x: 0, y: 0 },
        isDragging: false,
        dragTarget: null,
        dragStep: 0,
        history: [],
        lastMouse: { x: 0, y: 0 },
        lastPinchDist: 0,
        view: { x: 0, y: 0, scale: 1 },
        dpr: 1,
        gravity: 9.8,
        mass1: 15,
        mass2: 15,
        mode: 'simple',
        ...initialState
      });

      const updatePendulumPositions = () => {
        const s = engineRef.current;
        if (s.pivot) {
          s.pendulum1.x = s.pivot.x + s.pendulum1.length * Math.sin(s.pendulum1.angle);
          s.pendulum1.y = s.pivot.y + s.pendulum1.length * Math.cos(s.pendulum1.angle);
          
          s.pendulum2.x = s.pendulum1.x + s.pendulum2.length * Math.sin(s.pendulum2.angle);
          s.pendulum2.y = s.pendulum1.y + s.pendulum2.length * Math.cos(s.pendulum2.angle);
        }
      };

      const resetSimulation = () => {
        const s = engineRef.current;
        s.pivot = null;
        s.history = [];
        s.pendulum1 = { angle: Math.PI/4, velocity: 0, length: 200, x: 0, y: 0 };
        s.pendulum2 = { angle: Math.PI/4, velocity: 0, length: 0, x: 0, y: 0 };
        s.dragStep = 0;
        s.isDragging = false;
        s.dragTarget = null;
      };

      const value = {
        engineRef,
        updatePendulumPositions,
        resetSimulation,
        isSimulating,
        gravity,
        mass1,
        mass2,
        mode
      };

      return (
        <PhysicsContext.Provider value={value}>
          {children}
        </PhysicsContext.Provider>
      );
    };

    // Hook de renderizado
    const usePendulumRenderer = (canvasRef, view) => {
      const drawRingAnchor = useCallback((ctx, p, r, scale, active) => {
        const rad = r / scale;
        // Sombra
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 5;

        // Aro exterior
        const gradRing = ctx.createRadialGradient(
          p.x - rad*0.5, 
          p.y - rad*0.5, 
          rad*0.2, 
          p.x, 
          p.y, 
          rad
        );
        gradRing.addColorStop(0, '#e2e8f0');
        gradRing.addColorStop(0.5, '#64748b');
        gradRing.addColorStop(1, '#1e293b');

        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, Math.PI*2, false); // Exterior
        ctx.arc(p.x, p.y, rad * 0.4, 0, Math.PI*2, true); // Agujero interior
        ctx.fillStyle = gradRing;
        ctx.fill();
        ctx.restore();

        // Aro de selección
        if (active) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, rad + 5/scale, 0, Math.PI*2);
          ctx.strokeStyle = 'rgba(30, 58, 138, 0.8)'; // Darker blue selection
          ctx.lineWidth = 2/scale;
          ctx.stroke();
        }
      }, []);

      const drawMetallicBall = useCallback((ctx, p, r, colorHue, scale, active) => {
        const rad = r / scale;

        // Sombra de la esfera
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetX = 3;
        ctx.shadowOffsetY = 3;

        // Gradiente Esférico
        const grad = ctx.createRadialGradient(
          p.x - rad*0.3, 
          p.y - rad*0.3, 
          rad*0.1, 
          p.x, 
          p.y, 
          rad
        );

        if (colorHue === 'blue') {
          grad.addColorStop(0, '#bfdbfe'); // Brillo especular
          grad.addColorStop(0.4, '#3b82f6'); // Color base
          grad.addColorStop(1, '#172554'); // Sombra propia
        } else { // Purple
          grad.addColorStop(0, '#e9d5ff');
          grad.addColorStop(0.4, '#9333ea');
          grad.addColorStop(1, '#581c87');
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, Math.PI*2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();

        // Anillo de selección - CAMBIADO A GRIS OSCURO
        if (active) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, rad + 5/scale, 0, Math.PI*2);
          ctx.strokeStyle = 'rgba(15, 23, 42, 0.6)'; // Gris Pizarra Oscuro
          ctx.lineWidth = 2/scale;
          ctx.stroke();
        }
      }, []);

      const render = useCallback((state, mode, trailLength) => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        const { x, y, scale } = view;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        if (state.pivot) {
          // ESTELA SUAVE
          if (mode === 'compound' && state.history.length > 1) {
            ctx.beginPath();
            // Gradiente para la estela (desvanece al final)
            const gradient = ctx.createLinearGradient(
              state.history[0].x, state.history[0].y,
              state.history[state.history.length-1].x, state.history[state.history.length-1].y
            );
            gradient.addColorStop(0, 'rgba(147, 81, 234, 0)');
            gradient.addColorStop(1, 'rgba(147, 81, 234, 0.5)');
            ctx.strokeStyle = gradient;

            ctx.lineWidth = 3 / scale;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.moveTo(state.history[0].x, state.history[0].y);
            for (let i = 1; i < state.history.length; i++) {
              ctx.lineTo(state.history[i].x, state.history[i].y);
            }
            ctx.stroke();
          }

          // BRAZOS METÁLICOS
          ctx.lineCap = 'round';
          ctx.lineWidth = 3 / scale;
          // Gradiente para la cuerda
          const stringGrad = ctx.createLinearGradient(
            state.pivot.x, 
            state.pivot.y, 
            state.pendulum2.x, 
            state.pendulum2.y
          );
          stringGrad.addColorStop(0, '#94a3b8');
          stringGrad.addColorStop(0.5, '#cbd5e1');
          stringGrad.addColorStop(1, '#94a3b8');
          ctx.strokeStyle = stringGrad;

          ctx.beginPath();
          ctx.moveTo(state.pivot.x, state.pivot.y);
          ctx.lineTo(state.pendulum1.x, state.pendulum1.y);
          if (mode === 'compound' && state.pendulum2.length > 0) {
            ctx.lineTo(state.pendulum2.x, state.pendulum2.y);
          }
          ctx.stroke();

          // PIVOTE ARO (Ring Anchor)
          const isPivotActive = state.dragTarget === 'pivot';
          drawRingAnchor(ctx, state.pivot, 12, scale, isPivotActive);

          // MASAS 3D (Metallic Spheres)
          const isP1Active = state.dragTarget === 'p1';
          drawMetallicBall(ctx, state.pendulum1, 10 + state.mass1/5, 'blue', scale, isP1Active);

          if (mode === 'compound' && state.pendulum2.length > 0) {
            const isP2Active = state.dragTarget === 'p2';
            drawMetallicBall(ctx, state.pendulum2, 10 + state.mass2/5, 'purple', scale, isP2Active);
          }
        }
        ctx.restore();
      }, [canvasRef, view, drawRingAnchor, drawMetallicBall]);

      return { render };
    };

    // Hook de audio
    const useAudio = (isMuted, isSimulating) => {
      const audioCtxRef = useRef(null);
      const nodesRef = useRef(null);

      const initAudio = useCallback(async () => {
        if (audioCtxRef.current) {
          if (audioCtxRef.current.state === 'suspended') {
            await audioCtxRef.current.resume();
          }
          return;
        }

        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioContext();

          const createOsc = (type, volume = 0.1) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            gain.gain.value = 0;
            osc.connect(gain);
            osc.start();
            return { osc, gain, baseVol: volume };
          };

          const bass = createOsc('triangle', 0.4);
          const lead = createOsc('sine', 0.25);
          const leadHarmonic = createOsc('triangle', 0.1);

          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 1400;

          const delay = ctx.createDelay(1.0);
          const feedback = ctx.createGain();
          feedback.gain.value = 0.35;

          const master = ctx.createGain();
          master.gain.value = 0.8;

          bass.gain.connect(filter);
          lead.gain.connect(filter);
          leadHarmonic.gain.connect(filter);

          filter.connect(master);
          master.connect(ctx.destination);

          master.connect(delay);
          delay.connect(feedback);
          feedback.connect(delay);
          delay.connect(ctx.destination);

          audioCtxRef.current = ctx;
          nodesRef.current = { bass, lead, leadHarmonic, delay, master, ctx };

          if (ctx.state === 'suspended') await ctx.resume();
        } catch (e) {
          console.error("Audio error", e);
        }
      }, []);

      const updateAudio = useCallback((state) => {
        if (!nodesRef.current || isMuted || !isSimulating) {
          if (nodesRef.current) {
            const now = audioCtxRef.current.currentTime;
            nodesRef.current.bass.gain.gain.setTargetAtTime(0, now, 0.1);
            nodesRef.current.lead.gain.gain.setTargetAtTime(0, now, 0.1);
            nodesRef.current.leadHarmonic.gain.gain.setTargetAtTime(0, now, 0.1);
          }
          return;
        }

        const { bass, lead, leadHarmonic, delay, ctx } = nodesRef.current;
        const { pendulum1, pendulum2, pivot } = state;
        if (!pivot || !pendulum1 || !pendulum2) return;
        const now = ctx.currentTime;

        const safeP1X = Number.isFinite(pendulum1.x) ? pendulum1.x : 0;
        const safeP1Y = Number.isFinite(pendulum1.y) ? pendulum1.y : 0;
        const safeP2X = Number.isFinite(pendulum2.x) ? pendulum2.x : 0;
        const safeP2Y = Number.isFinite(pendulum2.y) ? pendulum2.y : 0;
        const safePivotX = Number.isFinite(pivot.x) ? pivot.x : 0;
        const safePivotY = Number.isFinite(pivot.y) ? pivot.y : 0;

        const dx1 = Math.max(-2, Math.min(2, (safeP1X - safePivotX) / 400));
        const dy1 = Math.max(0, Math.min(1, 1 - (safeP1Y - safePivotY + 300) / 600));
        const dx2 = Math.max(-2, Math.min(2, (safeP2X - safePivotX) / 400));
        const dy2 = Math.max(0, Math.min(1, 1 - (safeP2Y - safePivotY + 300) / 600));

        const freqBass = 65.4 * Math.pow(2, (dx1 + 1) * 2);
        if (Number.isFinite(freqBass)) {
          bass.osc.frequency.setTargetAtTime(freqBass, now, 0.1);
        }
        bass.gain.gain.setTargetAtTime(dy1 * bass.baseVol, now, 0.1);

        const dTime = Math.max(0, Math.min(0.9, Math.abs(dx1) * 0.5));
        delay.delayTime.setTargetAtTime(dTime, now, 0.1);

        const freqLead = 261.6 * Math.pow(2, (dx2 + 1) * 3);
        if (Number.isFinite(freqLead)) {
          lead.osc.frequency.setTargetAtTime(freqLead, now, 0.05);
          leadHarmonic.osc.frequency.setTargetAtTime(freqLead * 1.5, now, 0.05);
        }

        const volL = dy2 * lead.baseVol;
        lead.gain.gain.setTargetAtTime(volL, now, 0.1);
        leadHarmonic.gain.gain.setTargetAtTime(volL * 0.4, now, 0.1);
      }, [isMuted, isSimulating]);

      return { initAudio, updateAudio };
    };

    // Componente de Canvas
    const PendulumCanvas = ({ 
      isSimulating, 
      mode, 
      trailLength, 
      isMuted, 
      showInstructions, 
      setShowInstructions 
    }) => {
      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      const [view, setView] = useState({ x: 0, y: 0, scale: 1 });
      const lastMouseRef = useRef({ x: 0, y: 0 });
      
      const { engineRef, updatePendulumPositions, resetSimulation, gravity, mass1, mass2, mode: contextMode } = usePhysics();
      const { initAudio, updateAudio } = useAudio(isMuted, isSimulating);
      const { render } = usePendulumRenderer(canvasRef, view);

      const getScreenPos = useCallback((e) => {
        if (!e.touches && e.nativeEvent) {
          return { x: e.nativeEvent.offsetX, y: e.nativeEvent.offsetY };
        }
        const rect = canvasRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }, []);

      const toWorld = useCallback((screenX, screenY) => {
        const { x, y, scale } = view;
        return { x: (screenX - x) / scale, y: (screenY - y) / scale };
      }, [view]);

      const getDist = useCallback((a, b) => Math.sqrt((a.x - b.x)**2 + (a.y - b.y)**2), []);

      const findTarget = useCallback((worldPos, hitRadius) => {
        const s = engineRef.current;
        if (!s.pivot) return null;

        const candidates = [
          { id: 'pivot', pos: s.pivot, dist: getDist(worldPos, s.pivot) },
          { id: 'p1', pos: s.pendulum1, dist: getDist(worldPos, s.pendulum1) },
        ];

        if (s.mode === 'compound' && s.pendulum2.length > 0) {
          candidates.push({ id: 'p2', pos: s.pendulum2, dist: getDist(worldPos, s.pendulum2) });
        }

        const matches = candidates
          .filter(c => c.dist <= hitRadius)
          .sort((a, b) => a.dist - b.dist);

        if (matches.length > 0) return matches[0].id;
        return null;
      }, [getDist, engineRef]);

      const handleStart = useCallback(async (e) => {
        if (e.cancelable) e.preventDefault();
        const s = engineRef.current;

        // Actualizar parámetros desde o estado global
        s.gravity = gravity;
        s.mass1 = mass1;
        s.mass2 = mass2;
        s.mode = contextMode;

        if (e.touches && e.touches.length === 2) {
          s.dragTarget = 'zoom';
          s.lastPinchDist = getDist(
            { x: e.touches[0].clientX, y: e.touches[0].clientY },
            { x: e.touches[1].clientX, y: e.touches[1].clientY }
          );
          return;
        }

        const screenPos = getScreenPos(e);
        const worldPos = toWorld(screenPos.x, screenPos.y);
        const hitRadius = 50 / view.scale;

        if (s.pivot) {
          const target = findTarget(worldPos, hitRadius);
          if (target) {
            if (target === 'create_p2') {
              s.dragTarget = 'p2';
              s.dragStep = 2;
            } else {
              s.dragTarget = target;
            }
            s.isDragging = true;
            s.history = [];
            return;
          }
        }

        if (!s.pivot) {
          s.pivot = worldPos;
          s.dragStep = 1;
          s.dragTarget = 'p1';
          s.isDragging = true;
          s.history = [];
          setShowInstructions(false);
        } else {
          s.dragTarget = 'pan';
          s.isDragging = true;
          s.lastMouse = { x: screenPos.x, y: screenPos.y };
        }
      }, [engineRef, getScreenPos, toWorld, findTarget, view, setShowInstructions, gravity, mass1, mass2, contextMode]);

      const handleMove = useCallback((e) => {
        const s = engineRef.current;
        
        // Actualizar parámetros desde o estado global
        s.gravity = gravity;
        s.mass1 = mass1;
        s.mass2 = mass2;
        s.mode = contextMode;
        
        const screenPos = getScreenPos(e);
        const worldPos = toWorld(screenPos.x, screenPos.y);

        if (!s.isDragging) {
          const hitRadius = 50 / view.scale;
          if (s.pivot) {
            const target = findTarget(worldPos, hitRadius);
          } else {
          }
          return;
        }

        if (s.dragTarget === 'zoom' && e.touches?.length === 2) {
          const d = getDist(
            { x: e.touches[0].clientX, y: e.touches[0].clientY },
            { x: e.touches[1].clientX, y: e.touches[1].clientY }
          );
          const ratio = d / s.lastPinchDist;
          setView(prevView => ({ ...prevView, scale: Math.max(0.2, Math.min(4, prevView.scale * ratio)) }));
          s.lastPinchDist = d;
          return;
        }

        if (s.dragTarget === 'pan') {
          const dx = screenPos.x - s.lastMouse.x;
          const dy = screenPos.y - s.lastMouse.y;
          setView(prevView => ({ ...prevView, x: prevView.x + dx, y: prevView.y + dy }));
          s.lastMouse = { x: screenPos.x, y: screenPos.y };
          return;
        }

        if (s.dragTarget === 'pivot') {
          s.pivot = worldPos;
        } else if (s.dragTarget === 'p1') {
          const dx = worldPos.x - s.pivot.x;
          const dy = worldPos.y - s.pivot.y;
          s.pendulum1.length = Math.max(20, Math.sqrt(dx*dx + dy*dy));
          s.pendulum1.angle = Math.atan2(dx, dy);
          s.pendulum1.velocity = 0;
        } else if (s.dragTarget === 'p2') {
          const dx = worldPos.x - s.pendulum1.x;
          const dy = worldPos.y - s.pendulum1.y;
          s.pendulum2.length = Math.max(10, Math.sqrt(dx*dx + dy*dy));
          s.pendulum2.angle = Math.atan2(dx, dy);
          s.pendulum2.velocity = 0;
        }

        updatePendulumPositions();
        s.history = [];
      }, [engineRef, getScreenPos, toWorld, findTarget, updatePendulumPositions, view, gravity, mass1, mass2, contextMode]);

      const handleEnd = useCallback(() => {
        const s = engineRef.current;
        
        // Actualizar parámetros desde o estado global
        s.gravity = gravity;
        s.mass1 = mass1;
        s.mass2 = mass2;
        s.mode = contextMode;
        
        if (!s.isDragging) return;

        if (s.dragTarget === 'p1') {
          if (s.mode === 'simple') {
            if (s.dragStep === 1) {
            }
            s.dragStep = 2;
          } else {
            if (s.dragStep === 1) {
              s.pendulum2.length = 100;
              s.pendulum2.angle = s.pendulum1.angle;
              s.pendulum2.velocity = 0;
              updatePendulumPositions();
              s.dragStep = 2;
            }
          }
        }

        s.isDragging = false;
        s.dragTarget = null;
      }, [engineRef, gravity, mass1, mass2, contextMode, updatePendulumPositions]);

      const loop = useCallback(() => {
        const s = engineRef.current;

        // Actualizar parámetros desde o estado global
        s.gravity = gravity;
        s.mass1 = mass1;
        s.mass2 = mass2;
        s.mode = contextMode;

        if (s.pivot) {
          if (isSimulating) {
            const dt = 0.2;
            const g = s.gravity * 0.15;
            const isDraggingAny = s.isDragging && s.dragTarget !== 'pan' && s.dragTarget !== 'zoom';

            if (!isDraggingAny) {
              if (s.mode === 'simple') {
                // Cálculo para péndulo simple
                const accel = -(g / s.pendulum1.length) * Math.sin(s.pendulum1.angle);
                s.pendulum1.velocity += accel * dt;
                s.pendulum1.angle += s.pendulum1.velocity * dt;
                s.pendulum1.velocity *= 0.998;
              } else {
                // Cálculo para péndulo composto
                const m1 = s.mass1, m2 = s.mass2, l1 = s.pendulum1.length, l2 = s.pendulum2.length;
                const a1 = s.pendulum1.angle, a2 = s.pendulum2.angle, v1 = s.pendulum1.velocity, v2 = s.pendulum2.velocity;
                
                const den = l1 * (2 * m1 + m2 - m2 * Math.cos(2 * a1 - 2 * a2));
                if (den !== 0) {
                  const a1_acc = (-g*(2*m1+m2)*Math.sin(a1) - m2*g*Math.sin(a1-2*a2) - 2*Math.sin(a1-a2)*m2*(v2*v2*l2+v1*v1*l1*Math.cos(a1-a2))) / den;
                  const a2_acc = (2*Math.sin(a1-a2)*(v1*v1*l1*(m1+m2) + g*(m1+m2)*Math.cos(a1) + v2*v2*l2*m2*Math.cos(a1-a2))) / (l2 * (2*m1+m2-m2*Math.cos(2*a1-2*a2)));

                  const safeA1Acc = Math.max(-10, Math.min(10, a1_acc));
                  const safeA2Acc = Math.max(-10, Math.min(10, a2_acc));

                  s.pendulum1.velocity += safeA1Acc * dt; 
                  s.pendulum2.velocity += safeA2Acc * dt;
                  s.pendulum1.angle += s.pendulum1.velocity * dt; 
                  s.pendulum2.angle += s.pendulum2.velocity * dt;

                  s.pendulum1.velocity = Math.max(-2, Math.min(2, s.pendulum1.velocity));
                  s.pendulum2.velocity = Math.max(-3, Math.min(3, s.pendulum2.velocity));
                }
              }
            }
          }

          updatePendulumPositions();

          if (isSimulating && !s.isDragging) {
            s.history.push({ x: s.pendulum2.x, y: s.pendulum2.y });
            if (s.history.length > trailLength) {
              s.history.splice(0, s.history.length - trailLength);
            }
          } else if (!isSimulating && s.history.length > trailLength) {
            s.history.splice(0, s.history.length - trailLength);
          }

          updateAudio(s);
        }

        render(s, s.mode, trailLength);
      }, [engineRef, isSimulating, gravity, mass1, mass2, contextMode, trailLength, updatePendulumPositions, updateAudio, render]);

      useEffect(() => {
        const handleResize = () => {
          if (!containerRef.current || !canvasRef.current) return;

          const rect = containerRef.current.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;

          canvasRef.current.style.width = `${rect.width}px`;
          canvasRef.current.style.height = `${rect.height}px`;
          canvasRef.current.width = rect.width * dpr;
          canvasRef.current.height = rect.height * dpr;

          const ctx = canvasRef.current.getContext('2d');
          ctx.scale(dpr, dpr);
          engineRef.current.dpr = dpr;
        };

        const resizeObserver = new ResizeObserver(handleResize);
        if (containerRef.current) resizeObserver.observe(containerRef.current);

        window.addEventListener('resize', handleResize);
        setTimeout(handleResize, 0);

        // Iniciar o bucle de animación
        let animationFrameId;
        const startLoop = () => {
          loop();
          animationFrameId = requestAnimationFrame(startLoop);
        };
        startLoop();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          resizeObserver.disconnect();
        };
      }, [loop]);

      return (
        <div className="flex-1 relative flex overflow-hidden">
          <div className="flex-1 relative bg-slate-50" ref={containerRef}>
            <canvas
              ref={canvasRef}
              onMouseDown={handleStart} 
              onMouseMove={(e) => { lastMouseRef.current = getScreenPos(e); handleMove(e); }} 
              onMouseUp={handleEnd}
              onTouchStart={handleStart} 
              onTouchMove={handleMove} 
              onTouchEnd={handleEnd}
              className="absolute inset-0 w-full h-full touch-none cursor-default"
            />

            {showInstructions && (
              <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl">
                  <h3 className="text-2xl font-black mb-2">Composición Gravitatoria</h3>
                  <p className="text-sm text-slate-500 mb-8 leading-relaxed">Arrastra no lenzo para crear. Preme 'Parar' para editar calquera parte do péndulo sen que se mova.</p>
                  <button 
                    onClick={() => { initAudio(); setShowInstructions(false); }} 
                    className="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl active:scale-95 transition-transform shadow-lg shadow-blue-200"
                  >
                    Comezar
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // Componente de Panel de Control
    const ControlPanel = ({ 
      gravity, 
      setGravity, 
      mass1, 
      setMass1, 
      mass2, 
      setMass2, 
      trailLength, 
      setTrailLength, 
      mode, 
      setMode, 
      showControls, 
      setShowControls 
    }) => {
      return (
        <aside className={`absolute md:static right-0 top-0 bottom-0 w-72 bg-white border-l p-6 z-40 transition-transform duration-300 ${showControls ? 'translate-x-0 shadow-xl' : 'translate-x-full md:translate-x-0'}`}>
          <div className="space-y-8">
            <section>
              <label className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 block">Física</label>
              <div className="flex p-1 bg-slate-100 rounded-xl">
                <button 
                  onClick={() => setMode('simple')} 
                  className={`flex-1 py-2 text-sm font-bold rounded-lg ${mode === 'simple' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}
                >
                  Simple
                </button>
                <button 
                  onClick={() => setMode('compound')} 
                  className={`flex-1 py-2 text-sm font-bold rounded-lg ${mode === 'compound' ? 'bg-white shadow text-purple-600' : 'text-slate-500'}`}
                >
                  Dobre
                </button>
              </div>
            </section>
            
            <section className="space-y-6">
              <div className="space-y-2">
                <div className="flex justify-between text-xs font-bold">
                  <span>Gravidade</span>
                  <span>{gravity}</span>
                </div>
                <input 
                  type="range" 
                  min="0" 
                  max="25" 
                  step="0.5" 
                  value={gravity} 
                  onChange={e => setGravity(Number(e.target.value))} 
                  className="w-full h-1.5 bg-slate-100 rounded-lg appearance-none accent-blue-600 cursor-pointer" 
                />
              </div>
              
              <div className="space-y-2">
                <div className="flex justify-between text-xs font-bold">
                  <span>Masa Azul</span>
                  <span>{mass1}</span>
                </div>
                <input 
                  type="range" 
                  min="5" 
                  max="100" 
                  value={mass1} 
                  onChange={e => setMass1(Number(e.target.value))} 
                  className="w-full h-1.5 bg-slate-100 rounded-lg appearance-none accent-blue-600 cursor-pointer" 
                />
              </div>
              
              {mode === 'compound' && (
                <>
                  <div className="space-y-2">
                    <div className="flex justify-between text-xs font-bold">
                      <span>Masa Púrpura</span>
                      <span>{mass2}</span>
                    </div>
                    <input 
                      type="range" 
                      min="5" 
                      max="100" 
                      value={mass2} 
                      onChange={e => setMass2(Number(e.target.value))} 
                      className="w-full h-1.5 bg-slate-100 rounded-lg appearance-none accent-purple-600 cursor-pointer" 
                    />
                  </div>
                  
                  <div className="space-y-2 pt-2 border-t">
                    <div className="flex justify-between text-xs font-bold">
                      <span>Duración do Rastro</span>
                      <span>{trailLength}</span>
                    </div>
                    <input 
                      type="range" 
                      min="0" 
                      max="500" 
                      value={trailLength} 
                      onChange={e => setTrailLength(Number(e.target.value))} 
                      className="w-full h-1.5 bg-slate-100 rounded-lg appearance-none accent-purple-600 cursor-pointer" 
                    />
                  </div>
                </>
              )}
            </section>

            <div className="bg-amber-50 p-4 rounded-xl border border-amber-100 text-[11px] text-amber-800 leading-relaxed shadow-sm">
              <p className="font-bold flex items-center gap-1 mb-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
                Visualización
              </p>
              Usa o novo control deslizante de rastro para ver traxectorias máis curtas ou máis longas no modo dobre.
            </div>
          </div>
        </aside>
      );
    };

    // Componente principal
    const App = () => {
      const [gravity, setGravity] = useState(9.8);
      const [mass1, setMass1] = useState(15);
      const [mass2, setMass2] = useState(15);
      const [trailLength, setTrailLength] = useState(200);
      const [mode, setMode] = useState('simple');
      const [isSimulating, setIsSimulating] = useState(false);
      const [showInstructions, setShowInstructions] = useState(true);
      const [showControls, setShowControls] = useState(true);
      const [isMuted, setIsMuted] = useState(true);

      return (
        <PhysicsProvider 
          initialState={{ gravity, mass1, mass2, mode }} 
          isSimulating={isSimulating} 
          gravity={gravity}
          mass1={mass1}
          mass2={mass2}
          mode={mode}
        >
          <div className="fixed inset-0 bg-white flex flex-col font-sans text-slate-900 select-none overflow-hidden">
            <header className="h-16 bg-white border-b px-6 flex justify-between items-center z-50 shadow-sm">
              <div className="flex items-center gap-3">
                <div className="bg-blue-600 p-2 rounded-lg">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M10 10v6a4 4 0 0 0 8 0v-6"/>
                    <path d="M6 16v-4a4 4 0 1 1 8 0v4"/>
                    <circle cx="12" cy="12" r="10"/>
                  </svg>
                </div>
                <span className="font-bold text-lg">Péndulo Musical</span>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setIsSimulating(!isSimulating)}
                  className={`flex items-center gap-2 px-4 py-2 rounded-full font-bold transition-all ${isSimulating ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-green-100 text-green-700 hover:bg-green-200'}`}
                >
                  {isSimulating ? (
                    <>
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="4" width="4" height="16"/>
                        <rect x="14" y="4" width="4" height="16"/>
                      </svg> Parar
                    </>
                  ) : (
                    <>
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5,3 19,12 5,21"/>
                      </svg> Reproducir
                    </>
                  )}
                </button>

                <button 
                  onClick={() => setIsMuted(!isMuted)} 
                  className={`p-2 rounded-full transition-colors ${isMuted ? 'text-red-500 bg-red-50' : 'text-blue-600 bg-blue-50'}`}
                >
                  {isMuted ? (
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M11 5 6 9H2v6h4l5 4V5Z"/>
                      <path d="M23 9l-6 6M17 9l6 6"/>
                    </svg>
                  ) : (
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M11 5 6 9H2v6h4l5 4V5Z"/>
                      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                  )}
                </button>
                
                <button 
                  onClick={() => {
                    setGravity(9.8);
                    setMass1(15);
                    setMass2(15);
                    setTrailLength(200);
                    setMode('simple');
                    setIsSimulating(false);
                  }} 
                  className="p-2 text-slate-500 hover:bg-slate-100 rounded-full"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                  </svg>
                </button>
                
                <button 
                  onClick={() => setShowControls(!showControls)} 
                  className="p-2 text-slate-500 hover:bg-slate-100 rounded-full md:hidden"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="4" y1="7" x2="20" y2="7"/>
                    <line x1="4" y1="12" x2="20" y2="12"/>
                    <line x1="4" y1="17" x2="20" y2="17"/>
                  </svg>
                </button>
              </div>
            </header>

            <div className="flex-1 relative flex overflow-hidden">
              <PendulumCanvas 
                isSimulating={isSimulating}
                mode={mode}
                trailLength={trailLength}
                isMuted={isMuted}
                showInstructions={showInstructions}
                setShowInstructions={setShowInstructions}
              />
              
              <ControlPanel 
                gravity={gravity}
                setGravity={setGravity}
                mass1={mass1}
                setMass1={setMass1}
                mass2={mass2}
                setMass2={setMass2}
                trailLength={trailLength}
                setTrailLength={setTrailLength}
                mode={mode}
                setMode={setMode}
                showControls={showControls}
                setShowControls={setShowControls}
              />
            </div>
          </div>
        </PhysicsProvider>
      );
    };

    // Renderizar a aplicación
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
